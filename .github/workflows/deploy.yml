name: Deploy to Azure Container Apps

on:
  push:
    branches:
      - main
      - master

permissions:
  contents: 'read'
  id-token: 'write'
  actions: 'read'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to Azure (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle 8.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'

      - name: Build application
        run: |
          if [ -x ./gradlew ]; then
            ./gradlew --no-daemon clean bootJar -x test
          else
            gradle --no-daemon clean bootJar -x test
          fi

      - name: Build and push image to ACR
        env:
          ACR_NAME: ${{ secrets.ACR_NAME }}
        run: |
          IMAGE_TAG=${GITHUB_SHA}
          ACR_LOGIN_SERVER=${{ secrets.ACR_LOGIN_SERVER }}
          docker build -t ${ACR_LOGIN_SERVER}/${{ github.repository }}:${IMAGE_TAG} .
          az acr login --name ${ACR_NAME}
          docker push ${ACR_LOGIN_SERVER}/${{ github.repository }}:${IMAGE_TAG}

      - name: Update Container App image
        env:
          RESOURCE_GROUP: ${{ secrets.AZURE_RESOURCE_GROUP }}
          CONTAINER_APP_NAME: ${{ secrets.CONTAINER_APP_NAME }}
          ACR_LOGIN_SERVER: ${{ secrets.ACR_LOGIN_SERVER }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          az containerapp update \
            --name ${CONTAINER_APP_NAME} \
            --resource-group ${RESOURCE_GROUP} \
            --image ${ACR_LOGIN_SERVER}/${{ github.repository }}:${IMAGE_TAG}

      - name: Wait for deployment
        run: |
          echo "Waiting for the container app to become ready..."
          sleep 10
          az containerapp show --name ${{ secrets.CONTAINER_APP_NAME }} --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }} --query 'configuration.ingress.fqdn' -o tsv
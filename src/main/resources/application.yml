spring:
  datasource:
    url: jdbc:h2:mem:wallet;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
server:
  port: 8080

# To use PostgreSQL in development, create a profile (application-postgres.yml) and set:
# spring.datasource.url: jdbc:postgresql://localhost:5432/wallet
# spring.datasource.username: youruser
# spring.datasource.password: yourpassword
